<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtPerforma AI - Engine</title>
    
    <script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap');
        body, input, select, textarea { font-family: 'Arial', sans-serif; }
    </style>
    
    <script id="schema-injection" type="application/ld+json"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 antialiased py-8 px-4">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight" id="appTitle">Loading Engine...</h1>
            <p class="text-sm text-gray-500 mt-1" id="appDesc">Mounting data and format cartridges.</p>
        </header>

        <form id="dynamicForm" class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 space-y-6" onsubmit="event.preventDefault();">
            <div id="formFieldsContainer" class="space-y-6 border-b border-gray-200 pb-6">
                <!-- Data fields dynamically map here -->
            </div>

            <div class="flex flex-wrap items-center gap-4 pt-4">
                <button type="button" onclick="generatePDF()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow transition-colors">
                    Generate PDF
                </button>
                <button type="button" onclick="generateDOCX()" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 px-6 rounded shadow transition-colors">
                    Generate DOCX
                </button>
                <button type="button" onclick="generateODT()" class="bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-2 px-6 rounded shadow transition-colors">
                    Generate ODT
                </button>
            </div>
        </form>
    </div>

    <script>
        let dataSchema = {};
        let formatSchema = {};

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const [dataRes, formatRes, schemaRes] = await Promise.all([
                    fetch('./lib/layout-data.json', { cache: "no-store" }),
                    fetch('./lib/layout-format.json', { cache: "no-store" }),
                    fetch('./lib/schema.json', { cache: "no-store" })
                ]);
                
                if (!dataRes.ok || !formatRes.ok) throw new Error("Could not locate JSON cartridges.");

                dataSchema = await dataRes.json();
                formatSchema = await formatRes.json();
                const seoSchema = await schemaRes.json();
                
                if (!dataSchema.formSchema) throw new Error("Missing 'formSchema' in layout-data.json.");
                
                document.getElementById('schema-injection').textContent = JSON.stringify(seoSchema);
                document.getElementById('appTitle').innerText = dataSchema.formTitle || seoSchema.name;
                document.getElementById('appDesc').innerText = seoSchema.description;

                buildDynamicUI(dataSchema.formSchema);
            } catch (error) {
                console.error("Initialization Failed.", error);
                document.getElementById('appTitle').innerText = "System Error";
                document.getElementById('appDesc').innerText = error.message;
                document.getElementById('appDesc').className = "text-sm text-red-600 mt-1 font-bold";
            }
        });

        function buildDynamicUI(schema) {
            const container = document.getElementById('formFieldsContainer');
            container.innerHTML = "";
            
            Object.entries(schema).forEach(([sectionKey, sectionFields]) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = "grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-gray-50 border border-gray-200 rounded mb-4";
                
                Object.entries(sectionFields).forEach(([fieldId, fieldData]) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = "flex flex-col gap-1.5";

                    const label = document.createElement('label');
                    label.className = "text-sm font-semibold text-gray-700";
                    label.innerText = fieldData.label;
                    wrapper.appendChild(label);

                    const inputClass = "w-full rounded border border-gray-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-all";

                    if (fieldData.type === 'select') {
                        const select = document.createElement('select');
                        select.id = fieldId;
                        select.className = inputClass;
                        
                        if (Array.isArray(fieldData.options)) {
                            fieldData.options.forEach(opt => {
                                const option = document.createElement('option');
                                option.value = opt; option.innerText = opt;
                                select.appendChild(option);
                            });
                        }

                        if (fieldData.allowCustom) {
                            const customInput = document.createElement('input');
                            customInput.type = "text";
                            customInput.id = `${fieldId}_custom`;
                            customInput.className = inputClass + " hidden mt-2";
                            customInput.placeholder = "Please specify...";
                            
                            select.addEventListener('change', (e) => {
                                if (e.target.value === "Others") customInput.classList.remove("hidden");
                                else customInput.classList.add("hidden");
                            });
                            
                            wrapper.appendChild(select);
                            wrapper.appendChild(customInput);
                        } else {
                            wrapper.appendChild(select);
                        }
                    } else {
                        const input = document.createElement('input');
                        input.type = fieldData.type;
                        input.id = fieldId;
                        input.className = inputClass;
                        wrapper.appendChild(input);
                    }
                    sectionDiv.appendChild(wrapper);
                });
                container.appendChild(sectionDiv);
            });
        }

        function getFieldData(fieldId) {
            const el = document.getElementById(fieldId);
            if (!el) return "";
            if (el.tagName === "SELECT" && el.value === "Others") {
                const customEl = document.getElementById(`${fieldId}_custom`);
                return customEl ? customEl.value.trim() : "Others";
            }
            return el.value.trim();
        }

        function generatePDF() {
            if (!window.jspdf || !window.jspdf.jsPDF) return alert("PDF library loading.");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: [612, 972] });
            const layout = formatSchema.documentFormatSchema.layout;
            
            let y = 108;
            let currentNumber = 1;

            layout.forEach(item => {
                if (y > 864) { doc.addPage(); y = 108; }
                doc.setFont("Arial", item.format && item.format.bold ? "bold" : "normal");
                doc.setFontSize(item.format && item.format.size === 16 ? 16 : 12);

                let startX = 36;
                if (item.hierarchy === "secondary" || (item.format && item.format.align === "indented")) startX = 250;
                else if (item.format && item.format.align === "center") startX = 306; 

                if (item.type === "spacing") { y += item.height; return; }

                if (item.type === "static_text") {
                    doc.text(item.text, startX, y, { align: item.format.align === "center" ? "center" : "left" });
                    if (item.format.underlined) doc.line(startX, y + 2, startX + doc.getTextWidth(item.text), y + 2);
                    y += 20; return;
                }

                if (!item.type || item.type === "field_row" || item.fieldId) {
                    let labelText = item.numbered ? `${currentNumber++}.   ${item.label}` : item.label;
                    const userInput = getFieldData(item.fieldId);
                    doc.text(labelText, startX, y);
                    
                    let inputX = startX + doc.getTextWidth(labelText) + 10;
                    const drawData = item.inputStyle === "inline_text" ? item.inputText : (userInput || "_________________________________________");
                    doc.text(drawData, inputX, y);
                    if (item.format && item.format.linebreak) y += 20;
                }

                if (item.type === "inline_group") {
                    let currentX = startX;
                    item.fields.forEach(subField => {
                        doc.text(subField.label, currentX, y);
                        currentX += doc.getTextWidth(subField.label) + 5;
                        const subVal = getFieldData(subField.fieldId) || "______";
                        doc.text(subVal, currentX, y);
                        currentX += doc.getTextWidth(subVal) + 10;
                    });
                    y += 20;
                }
            });
            doc.save("Court_Performa_Generated.pdf");
        }

        function generateDOCX() {
            const layout = formatSchema.documentFormatSchema.layout;
            let currentNumber = 1;
            
            let contentHTML = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
                <style>
                    body { font-family: Arial, sans-serif; font-size: 12pt; line-height: 1.5; }
                    .center-title { text-align: center; font-size: 16pt; font-weight: bold; text-decoration: underline; margin-bottom: 20px; }
                    .field-row { margin-bottom: 10px; }
                    .indented { margin-left: 50px; font-weight: bold; }
                </style>
            </head>
            <body>`;

            layout.forEach(item => {
                if (item.type === "spacing") { contentHTML += `<br>`; return; }
                
                if (item.type === "static_text") {
                    const cls = item.format.align === "center" ? "center-title" : "";
                    contentHTML += `<div class="${cls}">${item.text}</div>`;
                    return;
                }

                if (!item.type || item.type === "field_row" || item.fieldId) {
                    let labelText = item.numbered ? `${currentNumber++}. ${item.label}` : item.label;
                    const userInput = getFieldData(item.fieldId);
                    const drawData = item.inputStyle === "inline_text" ? item.inputText : (userInput || "______________________");
                    const cls = item.hierarchy === "secondary" ? "indented" : "";
                    contentHTML += `<div class="field-row ${cls}">${labelText} &nbsp;&nbsp; ${drawData}</div>`;
                }

                if (item.type === "inline_group") {
                    let inlineStr = "";
                    item.fields.forEach(subField => {
                        inlineStr += `${subField.label} ${getFieldData(subField.fieldId) || "______"} &nbsp;&nbsp; `;
                    });
                    contentHTML += `<div class="field-row indented">${inlineStr}</div>`;
                }
            });

            contentHTML += `</body></html>`;
            const blob = new Blob(['\ufeff', contentHTML], { type: 'application/msword' });
            const downloadLink = document.createElement("a");
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = `CourtPerforma_Export.doc`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        function generateODT() {
            const layout = formatSchema.documentFormatSchema.layout;
            let currentNumber = 1;
            let xmlContent = ``;
            
            layout.forEach(item => {
                let styleName = "Standard";
                if (item.format && item.format.align === "center") styleName = "CenterHeading";
                if (item.hierarchy === "secondary" || (item.format && item.format.align === "indented")) styleName = "Indented";

                if (item.type === "spacing") { xmlContent += `<text:p text:style-name="Standard"></text:p>`; return; }

                if (item.type === "static_text") {
                    xmlContent += `<text:p text:style-name="${styleName}">${item.text}</text:p>`; return;
                }

                if (!item.type || item.type === "field_row" || item.fieldId) {
                    let labelText = item.numbered ? `${currentNumber++}.   ${item.label}` : item.label;
                    const userInput = getFieldData(item.fieldId);
                    const drawData = item.inputStyle === "inline_text" ? item.inputText : (userInput || "___________________");
                    xmlContent += `<text:p text:style-name="${styleName}">${labelText}    ${drawData}</text:p>`;
                }

                if (item.type === "inline_group") {
                    let inlineStr = "";
                    item.fields.forEach(subField => {
                        inlineStr += `${subField.label} ${getFieldData(subField.fieldId) || "______"}    `;
                    });
                    xmlContent += `<text:p text:style-name="${styleName}">${inlineStr}</text:p>`;
                }
            });

            const odtContainer = `<?xml version="1.0" encoding="UTF-8"?>
            <office:document xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
                             xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0"
                             xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0"
                             xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0"
                             office:mimetype="application/vnd.oasis.opendocument.text">
                <office:automatic-styles>
                    <style:style style:name="CenterHeading" style:family="paragraph">
                        <style:paragraph-properties fo:text-align="center"/>
                        <style:text-properties fo:font-weight="bold" fo:font-size="16pt"/>
                    </style:style>
                    <style:style style:name="Indented" style:family="paragraph">
                        <style:paragraph-properties fo:margin-left="1in"/>
                        <style:text-properties fo:font-weight="bold"/>
                    </style:style>
                    <style:style style:name="Standard" style:family="paragraph">
                        <style:text-properties fo:font-family="Arial" fo:font-size="12pt"/>
                    </style:style>
                </office:automatic-styles>
                <office:body><office:text>${xmlContent}</office:text></office:body>
            </office:document>`;
            
            const blob = new Blob([odtContainer], { type: 'application/vnd.oasis.opendocument.text' });
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = "Court_Performa_Export.fodt";
            anchor.click();
        }
    </script>
</body>
</html>
